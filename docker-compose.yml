# cp .env.example .env   (fill in GROQ_API_KEY and GEMINI_API_KEY)
# docker compose up --build   ->  http://localhost:8000
# Inference is remote (Groq + Gemini): the container is only a small web server.
services:
  ari:
    build: .
    env_file: .env
    volumes: [ari-data:/app/data]
    ports: ["8000:8000"]

volumes:
  ari-data:
